<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plantitus Pro</title>
  <meta name="description" content="Cuidado de plantas: recordatorios de riego y abono, diagnóstico, identificación y un catálogo con flora canaria, cactus y suculentas.">
  <meta name="theme-color" content="#dcfaee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plantitus Pro">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Aplica el tema guardado antes de pintar, para que no parpadee al abrir */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('pp.temaCSS') || 'null');
        if (!t) return;
        var osc = t.modo === 'oscuro' || (t.modo === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        var v = osc ? t.oscuro : t.claro, r = document.documentElement;
        for (var k in v) r.style.setProperty('--' + k, v[k]);
        r.setAttribute('data-modo', osc ? 'oscuro' : 'claro');
        r.style.colorScheme = osc ? 'dark' : 'light';
        if (v.desenfoque && v.desenfoque !== '0px') r.classList.add('translucido');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="icons/icon-512.png" alt="" width="96" height="96"><strong>Plantitus Pro</strong></div>
  <main id="vista" class="vista"></main>
  <nav id="tabbar" aria-label="Secciones" hidden></nav>
  <div id="capas"></div>
  <noscript>Plantitus Pro necesita JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
